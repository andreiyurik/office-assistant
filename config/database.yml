# PostgreSQL. Versions 9.3 and up are supported.
#
# Locally the server comes from `docker compose up -d db` (see compose.yml);
# the defaults below match that container. In production the same variables
# point at the Kamal accessory (see config/deploy.yml).
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: office_assistant_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: office_assistant_test

# Rails 8 keeps cache and queue in separate databases so their write traffic
# never competes with the app data. All three live in one Postgres server;
# `db:prepare` creates them.
production:
  primary: &primary_production
    <<: *default
    database: office_assistant_production
  cache:
    <<: *primary_production
    database: office_assistant_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: office_assistant_production_queue
    migrations_paths: db/queue_migrate
