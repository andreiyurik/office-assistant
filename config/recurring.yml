# Recurring jobs, run by the Solid Queue supervisor inside Puma. Production
# only: in development the queue is not running, and the release job is invoked
# by hand with `bin/rails office:release`.
production:
  release_abandoned_bookings:
    class: ReleaseAbandonedBookingsJob
    schedule: every minute
  expand_recurring_schedules:
    class: ExpandRecurringSchedulesJob
    schedule: every day at 4am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
