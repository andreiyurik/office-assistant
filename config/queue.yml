# Solid Queue only runs in production, inside Puma (SOLID_QUEUE_IN_PUMA in
# config/deploy.yml). In development and test jobs run inline, so there is
# nothing to configure there.
production:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
